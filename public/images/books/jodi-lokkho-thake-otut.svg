<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&amp;display=swap');
      .author-top {
        font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
        font-weight: 500;
        fill: #4B5563;
        text-anchor: middle;
        letter-spacing: 16px;
      }
      .title-calligraphy {
        font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
        font-weight: 700;
        fill: #A8051E;
      }
      .subtitle-label {
        font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
        font-weight: 600;
        fill: #111827;
      }
      .metric-highlight {
        font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
        font-weight: 700;
        fill: #A8051E;
      }
      .metric-label {
        font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
        font-weight: 600;
        fill: #1F2937;
      }
    </style>

    <linearGradient id="spine-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="2%" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="4%" stop-color="#000000" stop-opacity="0.08" />
      <stop offset="7%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="96%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16" />
    </linearGradient>
  </defs>

  <!-- Deep Crimson Outer Surround (#8E0616) -->
  <rect width="600" height="900" fill="#8E0616" />

  <!-- White Book Cover Card Inset -->
  <rect x="40" y="85" width="504" height="770" rx="3" fill="#FFFFFF" />

  <!-- Author Name at Top -->
  <text x="292" y="142" font-size="32" class="author-top">আ সি ফ  ই ক বা ল</text>

  <!-- Title Calligraphy -->
  <g transform="translate(130, 245)">
    <text x="35" y="30" font-size="76" class="title-calligraphy">যদি</text>
    <text x="40" y="125" font-size="90" class="title-calligraphy">লক্ষ্য</text>
    <text x="-48" y="215" font-size="80" class="title-calligraphy">থাকে</text>
    <text x="8" y="298" font-size="102" class="title-calligraphy" font-weight="700">অটুট</text>
    <!-- Dynamic sweep under 'টুট' -->
    <path d="M 15 310 Q 110 345 220 280" fill="none" stroke="#A8051E" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Subtitle: সাফল্যের খোলা কৌশল -->
  <text x="68" y="605" font-size="28" class="subtitle-label">সাফল্যের খোলা কৌশল</text>

  <!-- Photographic Portrait of Author Asif Iqbal with Crossed Arms (Bottom Right) -->
  <g transform="translate(180, 360)">
    <clipPath id="asif-clip">
      <rect x="40" y="40" width="324" height="495" rx="3" />
    </clipPath>
    <image href="/images/books/asif-arms-crossed.jpg" x="40" y="40" width="324" height="495" preserveAspectRatio="xMidYMid slice" clip-path="url(#asif-clip)" />
  </g>

  <!-- Lower Left Milestones & Achievements -->
  <g transform="translate(18, 730)">
    <!-- Point 1 -->
    <g transform="translate(0, 0)">
      <polygon points="0,0 8,-7 16,0 8,7" fill="#A8051E" transform="translate(0, -6) scale(0.75)" />
      <text x="18" y="0" font-size="17" class="metric-highlight">৭টি <tspan class="metric-label">স্বনামধন্য কোম্পানী</tspan></text>
    </g>
    <!-- Point 2 -->
    <g transform="translate(0, 32)">
      <polygon points="0,0 8,-7 16,0 8,7" fill="#A8051E" transform="translate(0, -6) scale(0.75)" />
      <text x="18" y="0" font-size="17" class="metric-highlight">৮২০হাজার+<tspan class="metric-label">কোটি টাকা অর্জন</tspan></text>
    </g>
    <!-- Point 3 -->
    <g transform="translate(0, 64)">
      <polygon points="0,0 8,-7 16,0 8,7" fill="#A8051E" transform="translate(0, -6) scale(0.75)" />
      <text x="18" y="0" font-size="17" class="metric-highlight">৩০ <tspan class="metric-label">বছরের অভিজ্ঞতা</tspan></text>
    </g>
    <!-- Point 4 -->
    <g transform="translate(0, 96)">
      <polygon points="0,0 8,-7 16,0 8,7" fill="#A8051E" transform="translate(0, -6) scale(0.75)" />
      <text x="18" y="0" font-size="17" class="metric-highlight">১ <tspan class="metric-label">তুখোড় কর্পোরেট</tspan></text>
    </g>
  </g>

  <!-- Hardcover Book Spine 3D Lighting Overlay -->
  <rect width="600" height="900" fill="url(#spine-shadow)" pointer-events="none" />
</svg>
